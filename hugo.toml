baseURL = "https://prajwal-banakar.github.io/"
title = "Prajwal's Blog"
theme = "PaperMod"
enableGitInfo = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[minify]
  disableXML = false
  disableHTML = false
  disableCSS = false
  disableJS = false
  disableJSON = false
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
author = "Prajwal Banakar"
description = "Apache Fluss Contributor | Distributed Systems | Open Source"
defaultTheme = "auto"
ShowCodeCopyButtons = true
ShowReadingTime = true
ShowPostNavLinks = true
ShowScrollToTop = true
mainSections = ["posts"]

[params.homeInfoParams]
  Title = "" # Keep this empty as we're putting the title in Content
Content = """
<div style='display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 1em;'>

  <div style='flex: 1; min-width: 300px; text-align: left;'>
    <h1 style='margin: 0; font-size: 2.2em; font-weight: 700; letter-spacing: -0.5px;'>Hi, I'm Prajwal Banakar</h1>
    <p style='margin: 0.5em 0 0.8em 0; font-size: 1.2em; color: var(--secondary); font-weight: 500;'>Software Engineer | Apache Fluss Contributor | GSoC'26</p>
    <p style='line-height: 1.6; font-size: 1.05em; color: var(--content); margin-bottom: 0;'>
      Welcome to my blog where I document my journey, share technical insights, and explore the world of open source.
    </p>
  </div>

  <div style='flex-shrink: 0; margin: 0 auto;'>
    <img src='/images/profile-v2.png' alt='Prajwal Banakar' style='border-radius: 50%; width: 150px; height: 150px; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid var(--tertiary);'>
  </div>

</div>
"""

[params.assets]
favicon = "/favicon.ico"

[params.profileMode]
enabled = false # Keep this disabled to show recent posts
title = "Prajwal Banakar"
subtitle = "Backend Engineer | Apache Fluss Contributor | Distributed Systems"
imageUrl = "/images/profile-v2.png"
imageTitle = "Prajwal Banakar"
centerContent = true
[[params.profileMode.buttons]]
name = "My OSS Journey"
url = "/posts/my-oss-journey-apache-fluss/"
[[params.profileMode.buttons]]
name = "FIP-37 Proposal"
url = "https://cwiki.apache.org/confluence/display/FLUSS/FIP-37%3A+Native+RoaringBitmap+Integration+for+Apache+Fluss"

[[params.socialIcons]]
name = "github"
url = "https://github.com/Prajwal-banakar"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/prajwal-banakar"

[[params.socialIcons]]
name = "x"
url = "https://x.com/Pbanakar18"

[[params.socialIcons]]
name = "email"
url = "mailto:prajwal.banakara@gmail.com"

[menu]
[[menu.main]]
name = "Search"
url = "/search/"
weight = 1
keys = ["/"]

[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 2

[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 3

[[menu.main]]
name = "About"
url = "/about/"
weight = 4

[services]
  [services.googleAnalytics]
    ID = "G-XXXXXXXXXX" # Replace with your Google Analytics ID

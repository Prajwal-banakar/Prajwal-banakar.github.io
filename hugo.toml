url = "https://x.com/Pbanakar18"

[[params.socialIcons]]
name = "email"
url = "mailto:prajwal.banakara@gmail.com"

[menu]
[[menu.main]]
name = "Search"
url = "/search/"
weight = 1
keys = ["/"]

